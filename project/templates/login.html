<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveillance System | Secure Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  
  <div class="background-animation">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-container">
    <div class="card-glass">
      <div class="logo-area">
        <svg xmlns="http://www.w3.org/Form/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="camera-icon">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
      </div>
      <h2 class="title text-glow">I.V.S.S.</h2>
      <p class="subtitle">Intelligent Video Surveillance System</p>
      
      <form method="POST" action="/login" class="login-form">
        <div class="input-group">
          <input type="text" name="username" id="username" required autocomplete="off">
          <label for="username">Operator ID</label>
        </div>
        <div class="input-group">
          <input type="password" name="password" id="password" required>
          <label for="password">Passcode</label>
        </div>
        
        <button type="submit" class="btn-login">
          <span>Authenticate</span>
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
      
      <div class="system-status">
        <span class="status-dot"></span> System Online. Secure Connection.
      </div>
    </div>
  </div>

</body>
</html>
