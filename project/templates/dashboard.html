<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveillance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="dashboard-body">

  <nav class="dash-nav">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
        <circle cx="12" cy="13" r="3"></circle>
      </svg>
      <span class="brand-text">I.V.S.S. <span class="fw-light text-muted">| Command Center</span></span>
    </div>
    <div class="nav-actions">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">System Active</span>
      </div>
      <a href="/logout" class="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Disconnect
      </a>
    </div>
  </nav>

  <div class="container-fluid dashboard-container mt-4">
    <div class="row">
      <!-- Main Feed -->
      <div class="col-lg-8 mb-4">
        <div class="glass-panel">
          <div class="panel-header">
            <h5 class="panel-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="me-2 text-cyan">
                <path d="M2 12h4l2-9 5 18 2-9h5"></path>
              </svg>
              Live Primary Feed
            </h5>
            <span class="badge bg-danger pulse-badge">LIVE</span>
          </div>
          <div class="video-container">
            <img src="{{ url_for('video_feed') }}" alt="Live Feed" class="live-video">
            <div class="camera-overlay">
              <div class="crosshair top-left"></div>
              <div class="crosshair top-right"></div>
              <div class="crosshair bottom-left"></div>
              <div class="crosshair bottom-right"></div>
              <div class="cam-info">CAM 01 // MAIN_ENTRANCE // FPS: 30</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Logs -->
      <div class="col-lg-4">
        <div class="glass-panel h-100 d-flex flex-column">
          <div class="panel-header">
            <h5 class="panel-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="me-2 text-cyan">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              Attendance & Activity Logs
            </h5>
          </div>
          <div class="logs-container flex-grow-1" id="attendance">
            <!-- Logs will appear here -->
            <div class="log-entry empty-log">Waiting for events...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="alertToast" class="toast custom-toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header bg-dark text-white border-bottom border-danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="red"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <strong class="me-auto text-danger">Security Alert</strong>
        <small class="text-muted">Just now</small>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="alertMessage">Alert message here</div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
